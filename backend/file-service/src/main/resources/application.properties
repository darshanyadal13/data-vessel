spring.application.name=file-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/file_service
spring.datasource.username=root
spring.datasource.password=Root@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# AWS S3 Configuration (Update with your credentials)
aws.s3.bucket-name=data-vessel-bucket
aws.s3.region=us-east-1
aws.access-key-id=YOUR_ACCESS_KEY
aws.secret-access-key=YOUR_SECRET_KEY

# JWT Secret (Should match user-service)
jwt.secret=vQjH8L2mR9kW5nT3pX7sY1cZ4fB6gN0hD8jK5lM2qP9rV3wA7eU4tI1oY6xC8bN0mS5pL2kJ9hG3fD6aW1rT4eQ8vZ

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
